name: Deploy Ospio Hotel
run-name: Ospio ${{ inputs.operation }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'deploy = release FE + BE; status = check access; stage = upload only; build = verify only'
        type: choice
        required: true
        default: deploy
        options: [deploy, status, stage, build]

permissions:
  contents: read

jobs:
  access:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ospio-hotel-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check team credential and server permission before building
        run: python3 deploy/ospio_actions.py status ${{ inputs.operation == 'deploy' && '--require-enabled' || '' }}
        env:
          OSPIO_HOTEL_DEPLOY_KEY: ${{ secrets.OSPIO_HOTEL_DEPLOY_KEY }}
          OSPIO_HOTEL_KNOWN_HOSTS: ${{ secrets.OSPIO_HOTEL_KNOWN_HOSTS }}
          OSPIO_HOTEL_DEPLOY_READY: ${{ vars.OSPIO_HOTEL_DEPLOY_READY }}

  build:
    needs: access
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.operation != 'status' && (inputs.operation == 'build' || needs.access.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy -p "test_ospio_*.py"
      - run: npm ci
      - run: npm run check
      - run: npm exec --workspace @hotel/server -- drizzle-kit check
      - run: npm run build --workspace @hotel/server
      - run: npm run export --workspace @hotel/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ospio.online
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.OSPIO_WEB_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_SUPPORT_PHONE: ${{ vars.OSPIO_WEB_SUPPORT_PHONE }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.OSPIO_WEB_SUPPORT_EMAIL }}
          EXPO_PUBLIC_SUPPORT_WHATSAPP: ${{ vars.OSPIO_WEB_SUPPORT_WHATSAPP }}
          EXPO_PUBLIC_SUPPORT_TELEGRAM: ${{ vars.OSPIO_WEB_SUPPORT_TELEGRAM }}
      - name: Package the exact commit and build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=tar.gz --output=release/source.tar.gz "$GITHUB_SHA"
          test -s apps/server/dist/index.js
          test -s apps/server/dist/client-worker.js
          test -s apps/mobile/dist/index.html
          tar -czf release/build.tar.gz apps/server/dist apps/mobile/dist
          printf '%s\n' "$GITHUB_SHA" > release/commit
          tar -czf ospio-hotel-release.tar.gz -C release commit source.tar.gz build.tar.gz
          checksum="$(sha256sum ospio-hotel-release.tar.gz | cut -d ' ' -f 1)"
          python3 deploy/ospio_release.py ospio-hotel-release.tar.gz "$RUNNER_TEMP/ospio-validated" "$GITHUB_SHA" "$checksum"
      - id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ospio-hotel-release
          path: ospio-hotel-release.tar.gz
          if-no-files-found: error
          retention-days: 3

  production:
    permissions:
      contents: read
      actions: read
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'deploy' || inputs.operation == 'stage')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ospio-hotel-production
      url: https://ospio.online
    concurrency:
      group: ospio-hotel-production
      cancel-in-progress: false
    env:
      OSPIO_HOTEL_DEPLOY_KEY: ${{ secrets.OSPIO_HOTEL_DEPLOY_KEY }}
      OSPIO_HOTEL_KNOWN_HOSTS: ${{ secrets.OSPIO_HOTEL_KNOWN_HOSTS }}
      OSPIO_HOTEL_DEPLOY_READY: ${{ vars.OSPIO_HOTEL_DEPLOY_READY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ospio-hotel-release
      - name: Publish through the team service identity
        run: python3 deploy/ospio_actions.py ${{ inputs.operation }}
        env:
          GH_TOKEN: ${{ github.token }}
          OSPIO_RELEASE_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      - name: Verify frontend and backend release
        if: inputs.operation == 'deploy'
        run: |
          python3 deploy/ospio_actions.py status --require-enabled --require-current
          curl --fail --silent --show-error --retry 4 --retry-connrefused https://ospio.online/health
          curl --fail --silent --show-error https://ospio.online/release.json > "$RUNNER_TEMP/ospio-live-release.json"
          python3 -c 'import json, os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/ospio-live-release.json"))["commit"] == os.environ["GITHUB_SHA"]'
